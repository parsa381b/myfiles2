name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          # Create .env from template if not present
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          
          # Decode debug.keystore from base64 if needed, or generate fallback
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Package APK
        id: package_apk
        run: |
          mkdir -p build_output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file generated during build."
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build_output/MyFiles-Debug.apk
          echo "apk_path=build_output/MyFiles-Debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyFiles-Debug-APK
          path: build_output/MyFiles-Debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/MyFiles-Debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
